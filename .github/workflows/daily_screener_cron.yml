name: Daily Multi-Strategy Screener

on:
  schedule:
    # Runs Monday through Friday at 10:45 UTC (4:15 PM IST - immediately following NSE market close)
    - cron: '45 10 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Scan Date (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  run-screener-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Persistent Database & Backups Cache
        uses: actions/cache@v4
        with:
          path: |
            data/trading_platform.db
            output/backups/
          key: trading-db-${{ github.run_id }}
          restore-keys: |
            trading-db-

      - name: Stage 1 - Refresh Base Historical Technical Data
        run: |
          echo "[CRON] Stage 1: Updating 5Y NIFTY 750 Base Historical Technical Data..."
          python src/data_pipeline/update_daily_nifty750.py || echo "[WARN] Base data update step continued."

      - name: Stage 2 - Execute Multi-Strategy Live Screeners
        run: |
          echo "[CRON] Stage 2: Running Live Breakout Screeners across Strategies 1, 2, and 3..."
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python src/orchestrator.py --mode screener --date "${{ github.event.inputs.target_date }}"
          else
            python src/orchestrator.py --mode screener
          fi
          python -c "import json; d=json.load(open('output/consolidated_signals.json')); print(f'[CRON STATS] Extracted {d.get(\"total_triggers\")} triggers for {d.get(\"as_of_date\")}')"

      - name: Upload Daily Signals Artifacts (Archive)
        uses: actions/upload-artifact@v4
        with:
          name: daily-signals-and-db-backup
          path: |
            output/consolidated_signals.json
            output/system_health.json
            output/backups/
            data/trading_platform.db
          retention-days: 30

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Sync Newly Generated Signals to Frontend
        run: |
          mkdir -p frontend/public/data
          cp -f output/consolidated_signals.json frontend/public/data/ 2>/dev/null || true
          cp -f data/verified_backtest_data.json frontend/public/data/ 2>/dev/null || true
          cp -f output/system_health.json frontend/public/data/ 2>/dev/null || true

      - name: Compile Production PWA Bundle
        working-directory: frontend
        run: npx tsc && npx vite build

      - name: Deploy Live Signals & PWA to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

