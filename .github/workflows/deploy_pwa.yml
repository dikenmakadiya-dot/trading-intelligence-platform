name: Deploy QuantFlow PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'data/**'
      - 'output/**'
      - '.github/workflows/deploy_pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Sync Static Data to Frontend Public
        run: |
          mkdir -p frontend/public/data
          cp -f output/consolidated_signals.json frontend/public/data/ 2>/dev/null || true
          cp -f data/verified_backtest_data.json frontend/public/data/ 2>/dev/null || true

      - name: Build Frontend PWA Bundle
        working-directory: frontend
        run: npx tsc && npx vite build

      - name: Deploy to GitHub Pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist

