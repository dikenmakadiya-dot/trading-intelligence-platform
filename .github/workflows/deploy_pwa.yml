name: Deploy QuantFlow PWA to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'data/**'
      - 'output/**'
      - '.github/workflows/deploy_pwa.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync Static Data to Frontend Public
        run: |
          mkdir -p frontend/public/data
          cp -f output/consolidated_signals.json frontend/public/data/ 2>/dev/null || true
          cp -f data/verified_backtest_data.json frontend/public/data/ 2>/dev/null || true

      - name: Build Frontend PWA Bundle
        working-directory: frontend
        run: npx tsc && npx vite build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
