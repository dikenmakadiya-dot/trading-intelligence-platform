name: Manual Strategy Backtest Simulation

on:
  workflow_dispatch:
    inputs:
      strategy_id:
        description: 'Strategy to Backtest (rsi_52w_breakout, clean_candle_5y, gfs_mtf_rsi, or all)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  run-manual-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Persistent Database & Backups Cache
        uses: actions/cache@v4
        with:
          path: |
            data/trading_platform.db
            output/backups/
          key: trading-db-${{ github.run_id }}
          restore-keys: |
            trading-db-

      - name: Execute On-Demand Multi-Year Backtest Simulation
        run: |
          echo "[MANUAL BACKTEST] Running strategy backtest simulation on-demand..."
          python src/orchestrator.py --mode backtest

      - name: Upload Backtest Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manual-backtest-audit-results
          path: |
            output/strategy_summary.json
            output/backtest_results/
            data/trading_platform.db
          retention-days: 60

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Sync Verified Backtest Data to Frontend
        run: |
          mkdir -p frontend/public/data
          cp -f output/consolidated_signals.json frontend/public/data/ 2>/dev/null || true
          cp -f data/verified_backtest_data.json frontend/public/data/ 2>/dev/null || true
          cp -f output/system_health.json frontend/public/data/ 2>/dev/null || true

      - name: Compile Production PWA Bundle
        working-directory: frontend
        run: npx tsc && npx vite build

      - name: Deploy Updated Backtest & PWA to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
